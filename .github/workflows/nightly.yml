name: Nightly Builds

permissions:
  contents: write

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:  # Allow manual triggers

jobs:
  check-changes:
    name: Check for Changes
    runs-on: self-hosted
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      since_time: ${{ steps.time.outputs.since }}
    steps:
      - name: Get timestamp
        id: time
        run: |
          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          echo "since=${SINCE}" >> $GITHUB_OUTPUT

      - name: Get latest commits
        id: check
        run: |
          # Check for new commits in relevant repositories
          REPOS=(
            "librescoot/librescoot"
            "librescoot/meta-librescoot"
            "librescoot/scootui"
            "librescoot/ecu-service"
            "librescoot/vehicle-service"
            "librescoot/battery-service"
            "librescoot/bluetooth-service"
            "librescoot/update-service"
            "librescoot/version-service"
            "librescoot/pm-service"
            "librescoot/modem-service"
            "librescoot/ums-service"
            "librescoot/settings-service"
            "librescoot/dbc-backlight-service"
            "rescoot/radio-gaga"
          )

          SINCE="${{ steps.time.outputs.since }}"
          
          HAS_CHANGES=false
          for REPO in "${REPOS[@]}"; do
            echo "Checking repo ${REPO}..."
            COMMITS=$(curl -s "https://api.github.com/repos/${REPO}/commits?since=${SINCE}")
            echo "Found $(echo "$COMMITS" | jq 'length') commits since $SINCE"
            if [ "$(echo "$COMMITS" | jq 'length')" -gt 0 ]; then
              HAS_CHANGES=true
              echo "Found new commits in ${REPO}"
              break
            fi
          done
          
          echo "has_changes=${HAS_CHANGES}" >> $GITHUB_OUTPUT
          echo "has_changes=${HAS_CHANGES}"

  generate-timestamp:
    name: Generate Build Timestamp
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.set-timestamp.outputs.timestamp }}
    steps:
      - name: Set timestamp
        id: set-timestamp
        run: |
          # Generate timestamp in format YYYYMMDDThhmmss
          TIMESTAMP=$(date -u '+%Y%m%dT%H%M%S')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP"

  build:
    name: Build Firmware (${{ matrix.target }})
    needs: [check-changes, generate-timestamp]
    if: ${{ needs.check-changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.target }}
    strategy:
      matrix:
        target: [mdb, dbc]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Create Yocto directory
        run: |
          mkdir -p yocto
          sudo chown 999:999 yocto

      - name: Build firmware
        run: |
          sed -i 's/docker run -it/docker run -i/' build.sh
          sed -i 's/docker run -it/docker run -i/' interactive.sh
          sed -i 's/docker run -i/docker run -i -e EULA=1/' build.sh
          # Use the timestamp generated in the previous job
          LIBRESCOOT_VERSION="${{ needs.generate-timestamp.outputs.timestamp }}" ./build.sh ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          sudo rm -rf artifacts/*
          mkdir -p artifacts/${{ matrix.target }}
          if [ "${{ matrix.target }}" = "mdb" ]; then
            sudo rm -f yocto/build/tmp-glibc/deploy/images/librescoot-mdb/librescoot-mdb-image-librescoot-mdb-*.sdimg.gz
            sudo gzip -f -k -9 yocto/build/tmp-glibc/deploy/images/librescoot-mdb/librescoot-mdb-image-librescoot-mdb-*.sdimg
            cp yocto/build/tmp-glibc/deploy/images/librescoot-mdb/librescoot-mdb-image-librescoot-mdb-*.sdimg.gz artifacts/${{ matrix.target }}/librescoot-${{ matrix.target }}-${{ needs.generate-timestamp.outputs.timestamp }}.sdimg.gz
            cp yocto/build/tmp-glibc/deploy/images/librescoot-mdb/librescoot-mdb-image-librescoot-mdb-*.mender artifacts/${{ matrix.target }}/librescoot-${{ matrix.target }}-${{ needs.generate-timestamp.outputs.timestamp }}.mender
            sudo rm -f yocto/build/tmp-glibc/deploy/images/librescoot-mdb/librescoot-mdb-image-librescoot-mdb-*.sdimg.gz
          else
            sudo rm -f yocto/build/tmp/deploy/images/librescoot-dbc/librescoot-dbc-image-librescoot-dbc-*.sdimg.gz
            sudo gzip -f -k -9 yocto/build/tmp/deploy/images/librescoot-dbc/librescoot-dbc-image-librescoot-dbc-*.sdimg
            cp yocto/build/tmp/deploy/images/librescoot-dbc/librescoot-dbc-image-librescoot-dbc-*.sdimg.gz artifacts/${{ matrix.target }}/librescoot-${{ matrix.target }}-${{ needs.generate-timestamp.outputs.timestamp }}.sdimg.gz
            cp yocto/build/tmp/deploy/images/librescoot-dbc/librescoot-dbc-image-librescoot-dbc-*.mender artifacts/${{ matrix.target }}/librescoot-${{ matrix.target }}-${{ needs.generate-timestamp.outputs.timestamp }}.mender
            sudo rm -f yocto/build/tmp/deploy/images/librescoot-dbc/librescoot-dbc-image-librescoot-dbc-*.sdimg.gz
          fi
          ls -l artifacts/*

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target == 'mdb' && format('librescoot-{0}-{1}.wic.gz', matrix.target, needs.generate-timestamp.outputs.timestamp) || format('librescoot-{0}-{1}.zst', matrix.target, needs.generate-timestamp.outputs.timestamp) }}
          path: artifacts/${{ matrix.target }}/*
          retention-days: 1
          compression-level: 0

  create-release:
    name: Create Release
    needs: [check-changes, build, generate-timestamp]
    # Only create releases for scheduled builds or manual triggers on the main branch (scarthgap)
    if: ${{ (needs.check-changes.outputs.has_changes == 'true' && github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/scarthgap') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xdelta3
        run: |
          sudo apt-get update
          sudo apt-get install -y xdelta3

      - name: Create delta patches
        run: |
          set -e

          echo "Fetching previous release..."
          PREV_RELEASE=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r '[.[] | select(.prerelease == true and (.tag_name | startswith("nightly-")))] | .[0]')

          if [ "$PREV_RELEASE" == "null" ] || [ -z "$PREV_RELEASE" ]; then
            echo "No previous release found. Skipping delta creation."
            exit 0
          fi

          PREV_TAG=$(echo "$PREV_RELEASE" | jq -r '.tag_name')
          echo "Previous release: $PREV_TAG"

          # Create directory for previous release files
          mkdir -p previous_release

          # Download previous .mender files for both dbc and mdb
          for TARGET in dbc mdb; do
            echo "Processing target: $TARGET"

            # Find the previous .mender file URL
            PREV_MENDER_URL=$(echo "$PREV_RELEASE" | jq -r ".assets[] | select(.name | endswith(\"${TARGET}.mender\")) | .browser_download_url")

            if [ -z "$PREV_MENDER_URL" ] || [ "$PREV_MENDER_URL" == "null" ]; then
              echo "  Warning: No previous .mender file found for $TARGET. Skipping delta."
              continue
            fi

            echo "  Downloading previous .mender file..."
            PREV_MENDER_FILE="previous_release/librescoot-${TARGET}-previous.mender"
            curl -L -o "$PREV_MENDER_FILE" "$PREV_MENDER_URL"

            # Find the new .mender file in artifacts
            NEW_MENDER_FILE=$(find artifacts -name "*${TARGET}*.mender" -type f | head -n 1)

            if [ -z "$NEW_MENDER_FILE" ]; then
              echo "  Warning: No new .mender file found for $TARGET. Skipping delta."
              continue
            fi

            echo "  Creating delta patch..."
            echo "    Old: $PREV_MENDER_FILE"
            echo "    New: $NEW_MENDER_FILE"

            # Extract timestamp from new mender filename for output name
            TIMESTAMP="${{ needs.generate-timestamp.outputs.timestamp }}"
            OUTPUT_DELTA="artifacts/librescoot-${TARGET}-${TIMESTAMP}.delta"

            # Ensure the output directory exists
            mkdir -p "$(dirname "$OUTPUT_DELTA")"

            # Create the delta patch
            python3 mender-delta-create.py "$PREV_MENDER_FILE" "$NEW_MENDER_FILE" "$OUTPUT_DELTA"

            echo "  ✓ Delta created: $OUTPUT_DELTA"
          done

          echo "Delta patch creation complete!"

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=""
          HAS_CHANGES=false
          REPOS=(
            "librescoot/librescoot"
            "librescoot/meta-librescoot"
            "librescoot/scootui"
            "librescoot/ecu-service"
            "librescoot/vehicle-service"
            "librescoot/battery-service"
            "librescoot/bluetooth-service"
            "librescoot/modem-service"
            "librescoot/version-service"
            "librescoot/update-service"
            "librescoot/ums-service"
            "librescoot/settings-service"
            "librescoot/dbc-backlight-service"
            "rescoot/radio-gaga"
          )
          
          for REPO in "${REPOS[@]}"; do
            COMMITS=$(curl -s "https://api.github.com/repos/${REPO}/commits?since=${{ needs.check-changes.outputs.since_time }}")
            
            if [ "$(echo "$COMMITS" | jq 'length')" -gt 0 ]; then
              HAS_CHANGES=true
              CHANGELOG="${CHANGELOG}### ${REPO}\n\n"
              while IFS= read -r commit; do
                SHA=$(echo "$commit" | jq -r '.sha')
                MESSAGE=$(echo "$commit" | jq -r '.commit.message' | sed 's/"/\\"/g')
                URL=$(echo "$commit" | jq -r '.html_url')
                AUTHOR=$(echo "$commit" | jq -r '.commit.author.name')
                
                SHORT_MESSAGE=$(echo "$MESSAGE" | head -n1)
                
                CHANGELOG="${CHANGELOG}* [\`${SHA:0:7}\`](${URL}) - ${SHORT_MESSAGE}\n"
              done < <(echo "$COMMITS" | jq -c '.[]')
              CHANGELOG="${CHANGELOG}\n"
            fi
          done
          
          # Store raw changelog without URL encoding
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "has_changes=${HAS_CHANGES}" >> $GITHUB_OUTPUT

      - name: Set date tag
        id: date
        if: steps.changelog.outputs.has_changes == 'true'
        run: |
          # Use the timestamp from the generate-timestamp job
          echo "value=${{ needs.generate-timestamp.outputs.timestamp }}" >> $GITHUB_OUTPUT

      - name: Create Github release
        if: steps.changelog.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v1
        with:
          name: Nightly Build ${{ steps.date.outputs.value }}
          tag_name: nightly-${{ steps.date.outputs.value }}
          prerelease: true
          files: |
            artifacts/**/*
          body: |
            🌙 Nightly build of LibreScoot (version ${{ steps.date.outputs.value }})
            
            ⚠️ **WARNING: EXPERIMENTAL BUILD - DO NOT USE ON REAL HARDWARE** ⚠️
            
            This is an automated nightly build with version ${{ steps.date.outputs.value }} from commit ${{ github.sha }}. These builds are intended for development and testing purposes only.
            
            ## Changelog
            ${{ steps.changelog.outputs.content }}
            
            Build completed at: ${{ github.event.repository.updated_at }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: success() && steps.changelog.outputs.has_changes == 'true'
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          username: "LibreScoot Nightly Build"
          description: "🌙 New nightly build has been uploaded!"
          details: |
            **Release:** [Nightly Build ${{ steps.date.outputs.value }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/nightly-${{ steps.date.outputs.value }})

            ⚠️ **WARNING: EXPERIMENTAL BUILD - DO NOT USE ON REAL HARDWARE** ⚠️
            
            This is an automated nightly build with version ${{ steps.date.outputs.value }} from commit ${{ github.sha }}. These builds are intended for development and testing purposes only.
          color: '#3498db'
