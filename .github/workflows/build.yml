name: Builds
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
    && format('Build {0}{1}',
        inputs.channel || 'nightly',
        inputs.meta_librescoot_branch != '' && format(' (meta: {0})', inputs.meta_librescoot_branch) || '')
    || github.event_name == 'schedule' && 'Nightly build'
    || format('Build {0}', github.ref_name) }}

permissions:
  contents: write

on:
  schedule:
    # Not on the hour: GitHub documents the schedule event as delayed, and
    # queued runs as droppable, during high load, and names the start of every
    # hour as a high load window. Observed here as 01:00 nominal against 02:10,
    # 02:17 and 10:43 actual, with created_at equal to run_started_at each time,
    # so the lateness is in GitHub's scheduler rather than in our runners.
    - cron: '37 1 * * *'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build Channel'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - testing
      meta_librescoot_branch:
        description: 'meta-librescoot branch (default: wrynose)'
        required: false
        default: ''
        type: string
      minimal_only:
        description: 'Build only mdb-minimal and dbc-minimal (no release)'
        required: false
        default: false
        type: boolean

jobs:
  check-changes:
    name: Check for Changes
    runs-on: self-hosted
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Get latest commits
        id: check
        run: |
          # Check for new commits in relevant repositories
          REPOS=(
            "librescoot/librescoot"
            "librescoot/meta-librescoot"
            "librescoot/ecu-service"
            "librescoot/vehicle-service"
            "librescoot/battery-service"
            "librescoot/bluetooth-service"
            "librescoot/update-service"
            "librescoot/version-service"
            "librescoot/pm-service"
            "librescoot/modem-service"
            "librescoot/ums-service"
            "librescoot/settings-service"
            "librescoot/dbc-backlight-service"
            "librescoot/lsc"
            "librescoot/alarm-service"
            "librescoot/data-server"
            "rescoot/radio-gaga"
            "librescoot/uplink-service"
            "librescoot/redis-ipc"
            "librescoot/librefsm"
            "librescoot/pn7150"
            "librescoot/boot-animation"
            "librescoot/dbc-dispatcher"
            "librescoot/kernel-module-imx-pwm-led"
            "librescoot/keycard-service"
            "librescoot/scootui-qt"
            "librescoot/scootui-tui"
          )

          SINCE=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          
          HAS_CHANGES=false
          
          # Always build if manually triggered or pushed as a release tag
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] \
             || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            HAS_CHANGES=true
            echo "Manual trigger or tag push detected. Forcing build."
          else
            for REPO in "${REPOS[@]}"; do
              echo "Checking repo ${REPO}..."
              COMMITS=$(curl -s "https://api.github.com/repos/${REPO}/commits?since=${SINCE}")
              echo "Found $(echo "$COMMITS" | jq 'length') commits since $SINCE"
              if [ "$(echo "$COMMITS" | jq 'length')" -gt 0 ]; then
                HAS_CHANGES=true
                echo "Found new commits in ${REPO}"
                break
              fi
            done
          fi
          
          echo "has_changes=${HAS_CHANGES}" >> $GITHUB_OUTPUT
          echo "has_changes=${HAS_CHANGES}"

  generate-timestamp:
    name: Generate Build Timestamp
    runs-on: self-hosted
    outputs:
      timestamp: ${{ steps.set-timestamp.outputs.timestamp }}
      timestamp_iso: ${{ steps.set-timestamp.outputs.timestamp_iso }}
    steps:
      - name: Set timestamp
        id: set-timestamp
        run: |
          # Generate timestamp in format YYYYMMDDThhmmss (for version strings)
          TIMESTAMP=$(date -u '+%Y%m%dT%H%M%S')
          # ISO 8601 format (for GitHub API queries)
          TIMESTAMP_ISO=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "timestamp_iso=$TIMESTAMP_ISO" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP ($TIMESTAMP_ISO)"

  determine-matrix:
    name: Determine Build Matrix
    runs-on: self-hosted
    outputs:
      include: ${{ steps.set-matrix.outputs.include }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          if [ "${{ inputs.minimal_only }}" == "true" ]; then
            INCLUDE='[
              {"target":"mdb-minimal","runs_on":"mdb","variant_id":"unu-mdb-minimal"},
              {"target":"dbc-minimal","runs_on":"dbc","variant_id":"unu-dbc-minimal"}
            ]'
          else
            INCLUDE='[
              {"target":"mdb","runs_on":"mdb","variant_id":"unu-mdb"},
              {"target":"dbc","runs_on":"dbc","variant_id":"unu-dbc"},
              {"target":"mdb-minimal","runs_on":"mdb","variant_id":"unu-mdb-minimal"},
              {"target":"dbc-minimal","runs_on":"dbc","variant_id":"unu-dbc-minimal"}
            ]'
          fi
          echo "include=$(echo "$INCLUDE" | jq -c .)" >> $GITHUB_OUTPUT

  determine-version:
    name: Determine Version
    needs: [generate-timestamp]
    runs-on: self-hosted
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      tag: ${{ steps.set-version.outputs.tag }}
      prerelease: ${{ steps.set-version.outputs.prerelease }}
      channel: ${{ steps.set-version.outputs.channel }}
    steps:
      - name: Set version and tag
        id: set-version
        run: |
          TIMESTAMP="${{ needs.generate-timestamp.outputs.timestamp }}"
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
             # Triggered by tag
             TAG_NAME=${GITHUB_REF#refs/tags/}
             CHANNEL="stable"
             VERSION="$TAG_NAME"
             TAG="$TAG_NAME"
             PRERELEASE="false"
          else
             # Manual or Schedule
             CHANNEL="${{ inputs.channel }}"
             if [ -z "$CHANNEL" ]; then
               CHANNEL="nightly"
             fi
             
             if [ "$CHANNEL" == "testing" ]; then
               VERSION="testing-${TIMESTAMP}"
               TAG="$VERSION"
               PRERELEASE="true"
             else
               # Nightly. If a non-default meta_librescoot branch was passed,
               # tag it as custom-nightly-<timestamp>-<branch-slug> so the
               # artifact is distinguishable from the regular scheduled
               # nightly (same release stream, different tree).
               BRANCH_INPUT="${{ inputs.meta_librescoot_branch }}"
               if [ -n "$BRANCH_INPUT" ] && [ "$BRANCH_INPUT" != "wrynose" ]; then
                 BRANCH_SLUG=$(echo "$BRANCH_INPUT" | tr '/' '-' | tr -cd '[:alnum:]._-')
                 VERSION="custom-nightly-${TIMESTAMP}-${BRANCH_SLUG}"
               else
                 VERSION="nightly-${TIMESTAMP}"
               fi
               TAG="$VERSION"
               PRERELEASE="true"
             fi
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          
          echo "Channel: $CHANNEL"
          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Prerelease: $PRERELEASE"

  build:
    name: Build Firmware (${{ matrix.target }})
    needs: [check-changes, determine-version, determine-matrix]
    if: ${{ needs.check-changes.outputs.has_changes == 'true' }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include: ${{ fromJson(needs.determine-matrix.outputs.include) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: false

      - name: Create Yocto directory
        run: |
          mkdir -p yocto
          sudo chown 999:999 yocto

      - name: Build firmware
        id: build
        continue-on-error: true
        run: |
          sed -i 's/docker run -it/docker run -i/' build.sh
          sed -i 's/docker run -it/docker run -i/' interactive.sh
          sed -i 's/docker run -i/docker run -i -e EULA=1/' build.sh

          # Use the determined version
          LAYER_VERSION_meta_librescoot="${{ inputs.meta_librescoot_branch }}" \
          BUILD_CHANNEL="${{ needs.determine-version.outputs.channel }}" \
          LIBRESCOOT_VERSION="${{ needs.determine-version.outputs.version }}" \
          ./build.sh ${{ matrix.target }} 2>&1 | tee build.log

      - name: Recover from pseudo abort and retry
        if: steps.build.outcome == 'failure'
        run: |
          # Cancelling a build mid do_image_* leaves pseudo's inode database
          # for that recipe's WORKDIR out of sync with the rootfs, and every
          # rerun fails identically until the WORKDIR is cleared. Only that
          # recipe's WORKDIR is removed here; sstate-cache and downloads are
          # never touched, so bitbake restores from sstate on the retry.
          if ! grep -qE "abort\(\)ing pseudo client|Pseudo_Abort" build.log; then
            echo "::error::Build failed and is not a pseudo abort, see log above."
            exit 1
          fi

          echo "::warning::Detected a pseudo abort, cleaning the affected recipe's WORKDIR and retrying once."

          RECIPE=$(grep -oE '^ERROR: [A-Za-z0-9._+-]+ do_[A-Za-z0-9_]+:' build.log \
            | head -n1 \
            | sed -E 's/^ERROR: //; s/ do_.*$//; s/-[0-9][^ -]*-r[0-9]+$//') || true

          if [ -z "$RECIPE" ]; then
            echo "::error::Could not determine the failing recipe from the pseudo abort log."
            exit 1
          fi
          echo "Recipe: $RECIPE"

          find yocto/build/tmp/work -type f -path "*/${RECIPE}/*/pseudo/pseudo.log" 2>/dev/null | while read -r LOG; do
            echo "::group::pseudo.log ($LOG)"
            cat "$LOG"
            echo "::endgroup::"
          done || true

          find yocto/build/tmp/work -mindepth 2 -maxdepth 2 -type d -name "$RECIPE" -print0 \
            | xargs -0 -r sudo rm -rf

          sed -i 's/docker run -it/docker run -i/' build.sh
          sed -i 's/docker run -it/docker run -i/' interactive.sh
          sed -i 's/docker run -i/docker run -i -e EULA=1/' build.sh

          set +e
          LAYER_VERSION_meta_librescoot="${{ inputs.meta_librescoot_branch }}" \
          BUILD_CHANNEL="${{ needs.determine-version.outputs.channel }}" \
          LIBRESCOOT_VERSION="${{ needs.determine-version.outputs.version }}" \
          ./build.sh ${{ matrix.target }} 2>&1 | tee build-retry.log
          RETRY_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$RETRY_STATUS" -ne 0 ]; then
            echo "::error::Retry after pseudo-abort recovery also failed."
            exit 1
          fi

          echo "Retry succeeded after pseudo-abort recovery."

      - name: Verify systemd unit graph
        run: |
          set -uo pipefail

          ROOTFS=$(sudo find yocto/build -maxdepth 7 -type d \
            -path "*/work/*/librescoot-${{ matrix.target }}-image/*/rootfs" \
            -print -quit 2>/dev/null)

          if [ -z "$ROOTFS" ]; then
            echo "::warning::Could not locate rootfs; skipping systemd verify"
            exit 0
          fi
          echo "rootfs: $ROOTFS"

          if ! command -v systemd-analyze >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends systemd
          fi

          LOG=$(mktemp)
          # systemd-analyze verify exits 0 even when it reports a cycle, so
          # we capture the output and grep for the marker string instead.
          sudo systemd-analyze verify --root="$ROOTFS" \
            default.target multi-user.target sysinit.target \
            2>&1 | tee "$LOG" || true

          if grep -qE "ordering cycle|deleted to break ordering" "$LOG"; then
            echo "::error::systemd detected an ordering cycle in the built rootfs - see log above"
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          sudo rm -rf artifacts/*
          mkdir -p artifacts/${{ matrix.target }}
          VERSION="${{ needs.determine-version.outputs.version }}"
          
          if [ "${{ matrix.target }}" = "mdb" ]; then
            DEPLOY_DIR="yocto/build/tmp/deploy/images/unu-mdb"
            sudo rm -f ${DEPLOY_DIR}/librescoot-mdb-image-unu-mdb-*.sdimg.gz
            sudo gzip -f -k -9 ${DEPLOY_DIR}/librescoot-mdb-image-unu-mdb-*.sdimg
            cp ${DEPLOY_DIR}/librescoot-mdb-image-unu-mdb-*.sdimg.gz artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.gz
            cp ${DEPLOY_DIR}/librescoot-mdb-image-unu-mdb-*.sdimg.bmap artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.bmap || true
            cp ${DEPLOY_DIR}/librescoot-mdb-image-unu-mdb-*.mender artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.mender
            sudo rm -f ${DEPLOY_DIR}/librescoot-mdb-image-unu-mdb-*.sdimg.gz
            tar -chzf artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-boot-${VERSION}.tar.gz \
              -C ${DEPLOY_DIR} zImage librescoot-mdb.dtb u-boot-dtb.imx
          elif [ "${{ matrix.target }}" = "mdb-minimal" ]; then
            # Bootstrap image: only the flashable sdimg is useful. No .mender
            # (nobody OTAs onto a minimal image) and no boot tarball (boot
            # bits are identical to the full mdb image's).
            DEPLOY_DIR="yocto/build/tmp/deploy/images/unu-mdb"
            sudo rm -f ${DEPLOY_DIR}/librescoot-mdb-minimal-image-unu-mdb-*.sdimg.gz
            sudo gzip -f -k -9 ${DEPLOY_DIR}/librescoot-mdb-minimal-image-unu-mdb-*.sdimg
            cp ${DEPLOY_DIR}/librescoot-mdb-minimal-image-unu-mdb-*.sdimg.gz artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.gz
            cp ${DEPLOY_DIR}/librescoot-mdb-minimal-image-unu-mdb-*.sdimg.bmap artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.bmap || true
            sudo rm -f ${DEPLOY_DIR}/librescoot-mdb-minimal-image-unu-mdb-*.sdimg.gz
          elif [ "${{ matrix.target }}" = "dbc-minimal" ]; then
            DEPLOY_DIR="yocto/build/tmp/deploy/images/unu-dbc"
            sudo rm -f ${DEPLOY_DIR}/librescoot-dbc-minimal-image-unu-dbc-*.sdimg.gz
            sudo gzip -f -k -9 ${DEPLOY_DIR}/librescoot-dbc-minimal-image-unu-dbc-*.sdimg
            cp ${DEPLOY_DIR}/librescoot-dbc-minimal-image-unu-dbc-*.sdimg.gz artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.gz
            cp ${DEPLOY_DIR}/librescoot-dbc-minimal-image-unu-dbc-*.sdimg.bmap artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.bmap || true
            sudo rm -f ${DEPLOY_DIR}/librescoot-dbc-minimal-image-unu-dbc-*.sdimg.gz
          elif [ "${{ matrix.target }}" = "dbc" ]; then
            DEPLOY_DIR="yocto/build/tmp/deploy/images/unu-dbc"
            sudo rm -f ${DEPLOY_DIR}/librescoot-dbc-image-unu-dbc-*.sdimg.gz
            sudo gzip -f -k -9 ${DEPLOY_DIR}/librescoot-dbc-image-unu-dbc-*.sdimg
            cp ${DEPLOY_DIR}/librescoot-dbc-image-unu-dbc-*.sdimg.gz artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.gz
            cp ${DEPLOY_DIR}/librescoot-dbc-image-unu-dbc-*.sdimg.bmap artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.bmap || true
            cp ${DEPLOY_DIR}/librescoot-dbc-image-unu-dbc-*.mender artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.mender
            sudo rm -f ${DEPLOY_DIR}/librescoot-dbc-image-unu-dbc-*.sdimg.gz
            tar -chzf artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-boot-${VERSION}.tar.gz \
              -C ${DEPLOY_DIR} zImage librescoot-dbc.dtb u-boot-dtb.imx
          else
            sudo rm -f yocto/build/tmp/deploy/images/librescoot-dbc-rpi4/librescoot-dbc-image-librescoot-dbc-rpi4-*.sdimg.gz
            sudo gzip -f -k -9 yocto/build/tmp/deploy/images/librescoot-dbc-rpi4/librescoot-dbc-image-librescoot-dbc-rpi4-*.sdimg
            cp yocto/build/tmp/deploy/images/librescoot-dbc-rpi4/librescoot-dbc-image-librescoot-dbc-rpi4-*.sdimg.gz artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.gz
            cp yocto/build/tmp/deploy/images/librescoot-dbc-rpi4/librescoot-dbc-image-librescoot-dbc-rpi4-*.sdimg.bmap artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.sdimg.bmap || true
            cp yocto/build/tmp/deploy/images/librescoot-dbc-rpi4/librescoot-dbc-image-librescoot-dbc-rpi4-*.mender artifacts/${{ matrix.target }}/librescoot-${{ matrix.variant_id }}-${VERSION}.mender
            sudo rm -f yocto/build/tmp/deploy/images/librescoot-dbc-rpi4/librescoot-dbc-image-librescoot-dbc-rpi4-*.sdimg.gz
          fi
          ls -l artifacts/*

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: librescoot-${{ matrix.variant_id }}-${{ needs.determine-version.outputs.version }}
          path: artifacts/${{ matrix.target }}/*
          retention-days: 1
          compression-level: 0

  create-release:
    name: Create Release
    needs: [check-changes, build, determine-version, generate-timestamp]
    # Only create releases for scheduled builds, manual triggers on main branch, or tag pushes.
    # A minimal-only dispatch never releases, regardless of ref.
    if: ${{ needs.check-changes.outputs.has_changes == 'true' && inputs.minimal_only != true && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/wrynose') || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          clean: false

      - name: Clean artifacts directory
        run: |
          sudo rm -rf artifacts/*

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          path: artifacts

      - name: Install xdelta3
        run: |
          sudo apt-get update
          sudo apt-get install -y xdelta3

      - name: Debug - List artifacts directory
        run: |
          echo "Listing artifacts directory structure:"
          ls -la
          if [ -d artifacts ]; then
            find artifacts -type f -ls
          else
            echo "artifacts directory does not exist!"
          fi

      - name: Create delta patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          CURL_OPTS=(--fail --silent --show-error --location --connect-timeout 15 --retry 3 --retry-delay 5)
          # --retry-all-errors needs curl >= 7.71 and the self-hosted runner's
          # curl is not pinned, so only pass it where it is understood.
          if curl --retry-all-errors --version >/dev/null 2>&1; then
            CURL_OPTS+=(--retry-all-errors)
          fi
          AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")

          echo "Fetching previous release..."
          RELEASES_JSON=""
          for ATTEMPT in 1 2 3; do
            RESPONSE=$(curl "${CURL_OPTS[@]}" "${AUTH[@]}" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100") || RESPONSE=""

            # Anything that is not a JSON array is an error page or an API
            # error object, both of which silently yield zero releases below.
            if echo "$RESPONSE" | jq -e 'type == "array"' >/dev/null 2>&1; then
              RELEASES_JSON="$RESPONSE"
              break
            fi

            echo "  Attempt $ATTEMPT/3 failed, GitHub API did not return a release list."
            echo "  Response: $RESPONSE"
            if [ "$ATTEMPT" -lt 3 ]; then
              sleep $((ATTEMPT * 10))
            fi
          done

          # Publishing a release without deltas leaves a permanent hole in the
          # delta chain, so a failed fetch has to go red instead of skipping.
          if [ -z "$RELEASES_JSON" ]; then
            echo "Error: Failed to fetch releases from GitHub API after 3 attempts."
            exit 1
          fi

          # Determine previous release prefix based on channel
          CHANNEL="${{ needs.determine-version.outputs.channel }}"
          if [ "$CHANNEL" == "nightly" ]; then
             PREFIX="nightly-"
          elif [ "$CHANNEL" == "testing" ]; then
             PREFIX="testing-"
          elif [ "$CHANNEL" == "stable" ]; then
             # Diff against latest stable release (v*)
             PREFIX="v"
          fi

          PREV_RELEASE=$(echo "$RELEASES_JSON" | jq -r "[.[] | select(.prerelease == ${{ needs.determine-version.outputs.prerelease }} and (.tag_name | startswith(\"$PREFIX\")))] | .[0]")

          # First release in a channel has nothing to diff against.
          if [ "$PREV_RELEASE" == "null" ] || [ -z "$PREV_RELEASE" ]; then
            echo "No previous release found. Skipping delta creation."
            exit 0
          fi

          PREV_TAG=$(echo "$PREV_RELEASE" | jq -r '.tag_name')
          echo "Previous release: $PREV_TAG"
          
          # Create directory for previous release files
          rm -rf previous_release
          mkdir -p previous_release

          # Map targets to variant_ids
          declare -A VARIANT_MAP
          VARIANT_MAP[mdb]="unu-mdb"
          VARIANT_MAP[dbc]="unu-dbc"
          #VARIANT_MAP[rpi4]="librescoot-dbc-rpi4"

          # Download previous .mender files for all targets
          for TARGET in dbc mdb; do
            VARIANT_ID="${VARIANT_MAP[$TARGET]}"
            echo "Processing target: $TARGET (variant_id: $VARIANT_ID)"

            # Find the new .mender file in artifacts (exact name, see below)
            NEW_MENDER_FILE=$(find artifacts -name "librescoot-${VARIANT_ID}-${{ needs.determine-version.outputs.version }}.mender" -type f | head -n 1)

            # create-release only runs once every build job succeeded, so a
            # missing .mender means the artifact upload or naming broke.
            if [ -z "$NEW_MENDER_FILE" ]; then
              echo "  Error: No new .mender file found for variant_id $VARIANT_ID."
              exit 1
            fi

            # Exact-name match: substring matching on VARIANT_ID would also
            # hit librescoot-VARIANT_ID-minimal-* bootstrap assets.
            PREV_MENDER_URL=$(echo "$PREV_RELEASE" | jq -r --arg n "librescoot-${VARIANT_ID}-${PREV_TAG}.mender" '.assets[] | select(.name == $n) | .browser_download_url')

            if [ -z "$PREV_MENDER_URL" ] || [ "$PREV_MENDER_URL" == "null" ]; then
              echo "  Error: $PREV_TAG has no librescoot-${VARIANT_ID}-${PREV_TAG}.mender asset."
              echo "  This build has one, so the previous release is incomplete and the delta chain would break."
              exit 1
            fi

            echo "  Downloading previous .mender file..."
            PREV_MENDER_FILE="previous_release/librescoot-${VARIANT_ID}-previous.mender"
            curl "${CURL_OPTS[@]}" -o "$PREV_MENDER_FILE" "$PREV_MENDER_URL"

            echo "  Creating delta patch..."
            echo "    Old: $PREV_MENDER_FILE"
            echo "    New: $NEW_MENDER_FILE"

            # Extract version from new mender filename for output name
            VERSION="${{ needs.determine-version.outputs.version }}"
            OUTPUT_DELTA="artifacts/librescoot-${VARIANT_ID}-${VERSION}.delta"

            # Ensure the output directory exists
            mkdir -p "$(dirname "$OUTPUT_DELTA")"

            # Create the delta patch
            python3 mender-delta-create.py "$PREV_MENDER_FILE" "$NEW_MENDER_FILE" "$OUTPUT_DELTA"

            echo "  ✓ Delta created: $OUTPUT_DELTA"
          done

          echo "Delta patch creation complete!"

      - name: Generate SHA256SUMS
        run: |
          set -e
          cd artifacts
          # Hash every release artifact so the installer (and any other
          # downstream consumer) can verify a download wasn't truncated or
          # tampered with. Output basenames only — gh-release flattens its
          # uploads by basename, so paths in SHA256SUMS would be useless to
          # any consumer fetching from the release URL. Atomic rename so a
          # partial file is never visible.
          find . -type f -name 'librescoot-*' | while read -r f; do
            hash=$(sha256sum "$f" | cut -d' ' -f1)
            base=$(basename "$f")
            printf '%s  %s\n' "$hash" "$base"
          done | sort -k2 > SHA256SUMS.tmp
          mv SHA256SUMS.tmp SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        id: changelog
        env:
          CHANNEL: ${{ needs.determine-version.outputs.channel }}
          CURRENT_SHA: ${{ github.sha }}
          UNTIL_ISO: ${{ needs.generate-timestamp.outputs.timestamp_iso }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/workflows/scripts/changelog.sh

      - name: Create Github release
        if: steps.changelog.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2.4.2
        with:
          name: ${{ needs.determine-version.outputs.channel }} Build ${{ needs.determine-version.outputs.version }}
          tag_name: ${{ needs.determine-version.outputs.tag }}
          prerelease: ${{ needs.determine-version.outputs.prerelease }}
          files: |
            artifacts/**/*
          body: |
            ${{ needs.determine-version.outputs.channel == 'nightly' && '🌙' || (needs.determine-version.outputs.channel == 'testing' && '🧪' || '🚀') }} ${{ needs.determine-version.outputs.channel }} build of LibreScoot (version ${{ needs.determine-version.outputs.version }})

            This is a ${{ needs.determine-version.outputs.channel }} build with version ${{ needs.determine-version.outputs.version }} from commit ${{ github.sha }}.
            
            ## Changelog
            ${{ steps.changelog.outputs.content }}
            
            Build completed at: ${{ github.event.repository.updated_at }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate app token for site rebuilds
        if: steps.changelog.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: librescoot
          repositories: downloads.librescoot.org,librescoot.github.io

      - name: Trigger downloads site rebuild
        if: steps.changelog.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/downloads.librescoot.org
          event-type: releases-changed

      - name: Trigger main site rebuild
        if: steps.changelog.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: librescoot/librescoot.github.io
          event-type: releases-changed
