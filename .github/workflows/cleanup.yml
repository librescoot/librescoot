name: Clean up old releases

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  check-changes:
    name: Delete old nightlies
    runs-on: self-hosted
    steps:
      - name: Get timestamp
        uses: jay2610/delete-older-releases@1.0.0
        with:
          keep_latest: 30
          delete_type: 'prerelease'
          delete_tag_pattern: nightly
          target_branch: 'scarthgap'
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
