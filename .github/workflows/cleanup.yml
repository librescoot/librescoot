name: Clean up old releases

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  check-changes:
    name: Delete old nightlies
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wrynose
      # This repository's pin must match the qualified downloads-site pin.
      # An unset or invalid pin refuses cleanup rather than risking the bridge.
      - name: Delete old Nightlies while retaining the bridge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTA_NIGHTLY_BRIDGE_TAG: ${{ vars.OTA_NIGHTLY_BRIDGE_TAG }}
        run: python3 .github/workflows/scripts/cleanup-nightlies.py
